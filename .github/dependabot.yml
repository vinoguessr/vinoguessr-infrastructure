version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Keep workflows from the shared repository on the same source revision.
      shared-workflows:
        patterns:
          - "vinoguessr/.github/.github/workflows/*"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
