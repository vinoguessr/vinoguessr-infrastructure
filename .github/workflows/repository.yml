name: Repository CI
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    uses: vinoguessr/.github/.github/workflows/reusable-repository.yml@13fb97569cc4d4323a439db52f55ce962e63c12f
    permissions:
      contents: read
  terraform:
    uses: vinoguessr/.github/.github/workflows/reusable-terraform.yml@13fb97569cc4d4323a439db52f55ce962e63c12f
    permissions:
      contents: read
